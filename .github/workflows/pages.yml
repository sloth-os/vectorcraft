# Weekly WASM build of VectorCraft for the web, published to GitHub Pages.
#
# The wasm comes from storytold/vectorcraft@main (upstream); the app is a Trunk site
# (apps/vectorcraft-web) whose artifacts are content-hashed, so the whole site can be
# precached by a service worker and then works offline.
#
# Pages must be enabled on the repo with "GitHub Actions" as the source (Settings › Pages).
name: Publish WASM to Pages

on:
  schedule:
    # Weekly, Mondays 03:07 UTC (an off-minute, so the run doesn't land in GitHub's top-of-hour
    # API stampede). Scheduled runs fire only from the default branch.
    - cron: "7 3 * * 1"
  workflow_dispatch: # manual "Run workflow" button
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - scripts/pwa.mjs

permissions:
  contents: read
  actions: read # list this run's artifacts to deploy (the artifact-id lookup below)
  pages: write
  id-token: write

# One deploy at a time; a queued run replaces an older queued one, never a running one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Same wasm32 flags the app repo's own .cargo/config.toml sets (#2786, ~2.4x faster canvas),
  # restated here so the build keeps them even if that file stops applying (e.g. a cargo
  # config search-path change). A build without them still works, only slower.
  CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS: -C target-feature=+simd128

jobs:
  publish:
    name: Build and deploy
    runs-on: ubuntu-latest
    # Build ~30 min (cold, full Rust release build) + Pages sync of a 37.6 MB artifact
    # (observed >10 min in "syncing_files") + slack. The deploy step itself gives up
    # polling at 40 min without cancelling the sync.
    timeout-minutes: 75
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout this repo (the PWA script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout app (storytold/vectorcraft)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/vectorcraft
          # Weekly releases should track upstream main, not this repo's pins.
          ref: main
          # A shallow clone is enough to build and keeps the checkout fast.
          fetch-depth: 1
          path: app

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        uses: jetli/trunk-action@1346cc09eace4beb84e403e199a471346d4684c9 # v0.5.1
        with:
          # Pinned tool versions: a weekly rebuild on a moving toolchain is the classic way
          # an otherwise green build silently breaks months later. Local build verified
          # with 0.22.1.
          version: v0.22.1

      - name: Fetch craft-fonts (Arabic, Thai and Georgian web fonts)
        run: |
          set -euo pipefail
          # The Trunk post_build hook (`cargo xtask web-fonts`) copies the faces listed in
          # crates/text/web-fonts.txt from this checkout into the site's fonts/ folder,
          # keyed by SHA-256. Without it the app still builds; Arabic (and Thai, Georgian)
          # text just shows as boxes.
          #
          # The rev is upstream's own pin (.github/workflows/release.yml › craft-fonts-ref).
          # The three `startup` faces exist at that rev; the `background` Arabic display
          # families the list also names were never in this manifest, so they are skipped
          # with a warning in the build log — harmless (they are optional menu fonts).
          git clone --no-checkout --filter=blob:none https://github.com/storytold/craft-fonts.git "$RUNNER_TEMP/craft-fonts"
          git -C "$RUNNER_TEMP/craft-fonts" checkout b076417b5880bd4154bd22f00695b1d28c6bea83
          echo "CRAFT_FONTS_DIR=$RUNNER_TEMP/craft-fonts" >> "$GITHUB_ENV"

      - name: Build the Trunk site (release)
        working-directory: app/apps/vectorcraft-web
        run: trunk build --release

      - name: Add PWA support (manifest, icons, service worker)
        run: |
          set -euo pipefail
          # Move the dist out of the app tree, so it's obvious the workflow publishes
          # exactly what the build made, and drop the 1024px icon master in for the
          # manifest icons (the site itself ships only 32 and 256px). pwa.mjs resizes
          # from it with this repo's own PNG codec (Node stdlib) and removes it again:
          # it's build input, not site content, and must not be precached.
          rm -rf "$RUNNER_TEMP/dist"
          mv app/dist/web "$RUNNER_TEMP/dist"
          cp app/assets/app-icon/vectorcraft-1024.png "$RUNNER_TEMP/dist/icons/vectorcraft-1024.png"
          # Build residue, not content: Trunk's lock marker.
          rm -f "$RUNNER_TEMP/dist/.trunk-lock"
          node scripts/pwa.mjs "$RUNNER_TEMP/dist"
          # The dist is rebuilt weekly, but files keep the same name only when their
          # content changed. Print the site inventory for the build log.
          du -sh "$RUNNER_TEMP/dist"; find "$RUNNER_TEMP/dist" -type f | wc -l

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        id: artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ${{ runner.temp }}/dist

      - name: Deploy to GitHub Pages
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          # Same request shape as actions/deploy-pages (its create/status/cancel calls,
          # minus its 10-minute hard cap and its cancel-on-timeout): artifact id + build
          # SHA + the job's OIDC token, which Pages verifies server-side. The OIDC token
          # comes from the runtime's own $ACTIONS_ID_TOKEN_REQUEST_URL below.
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          sha="${GITHUB_SHA}"

          # The OIDC token the deploy API needs; requested for the default audience.
          echo "Requesting OIDC token…"
          tok=$(curl -sS --fail-with-body -H "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" \
            -H "Accept: application/json; api-version=2.0" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r '.value')
          if [ -z "$tok" ] || [ "$tok" = "null" ]; then
            echo "::error::OIDC token request failed"; exit 1
          fi
          echo "OIDC token acquired (${#tok} chars)"

          # The artifact id for this run's "github-pages" artifact.
          art_id=$(gh api "repos/$repo/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' | head -1)
          if [ -z "$art_id" ]; then echo "::error::no github-pages artifact"; exit 1; fi
          echo "Artifact id: $art_id"

          # Create the deployment. This is the exact body deploy-pages sends.
          resp=$(curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$repo/pages/deployments" \
            -d "{\"artifact_id\": $art_id, \"pages_build_version\": \"$sha\", \"oidc_token\": \"$tok\"}")
          echo "Deployment response: $resp"
          # The id when the response carries one (numeric, or a status_url whose last
          # path segment is it). Observed on this repo it carries neither, and the
          # status endpoint keys by the build SHA — actions/deploy-pages itself falls
          # back to exactly that, so a missing id is normal, not an error.
          dep_id=$(echo "$resp" | jq -r '
            if .id then .id
            elif .status_url then (.status_url | split("/") | last)
            else empty end')
          [ -n "$dep_id" ] || dep_id="$sha"
          page_url=$(echo "$resp" | jq -r '.page_url // empty')
          echo "page_url=$page_url" >> "$GITHUB_OUTPUT"

          # Poll the status endpoint — up to 40 minutes, no cancel. actions/deploy-pages
          # clamps its timeout input to 10 minutes (MAX_TIMEOUT in its source) and then
          # CANCELS the deployment server-side, killing a sync that might still finish;
          # this site is 37.6 MB compressed (~92 MB unpacked, the wasm alone is ~90 MB)
          # and its sync legitimately outlasts 10 minutes, so this step deploys with the
          # same API calls but polls longer and only ever reads status.
          #
          # Status taxonomy (from actions/deploy-pages' own temporaryErrorStatus /
          # finalErrorStatus maps): not_found and deployment_attempt_error are TRANSIENT
          # — the former is a race right after create, the latter retries server-side —
          # so they stay in the poll loop. A transient curl failure is the same: log it
          # and keep polling; the deadline is the only thing that ends the loop.
          deadline=$(( $(date +%s) + 40*60 ))
          errors=0
          while :; do
            sleep 20
            if ! st=$(curl -sS --max-time 30 -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$repo/pages/deployments/$dep_id" \
              | jq -r '.status // empty'); then
              errors=$((errors + 1))
              echo "::warning::status request failed ($errors in a row) — retrying"
              if [ "$errors" -ge 10 ]; then
                echo "::error::status endpoint unreachable 10 times in a row"; exit 1
              fi
            else
              errors=0
              echo "status: $st ($(date -u +%H:%M:%S))"
              case "$st" in
                succeed) echo "Deployed to $page_url"; exit 0 ;;
                deployment_failed|deployment_content_failed|deployment_cancelled|deployment_lost)
                  echo "::error::Pages deployment failed with status: $st"; exit 1 ;;
                ""|not_found|deployment_attempt_error|deployment_queued|deploying|syncing_files)
                  ;; # transient / in-flight: keep polling
                *)
                  echo "::warning::unrecognized status '$st' — keep polling";;
              esac
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              # Do NOT cancel: leave the sync running; it may still finish server-side.
              echo "::error::Status still '$st' after 40 minutes — leaving the sync running (no cancel), failing the job so the retry isn't blocked."
              exit 1
            fi
          done
